name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Build and reproduce the table
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Givaro, from the CASYS team at the LJK: exact arithmetic over GF(p) and
      # over the rationals. It is the only dependency.
      - name: Install Givaro
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgivaro-dev ninja-build

      # The repository claims the internship was carried over whole. This is
      # what makes that checkable rather than merely stated.
      - name: Every function of the original is accounted for
        run: python3 tools/check_coverage.py

      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Everything, including the three searches that took the internship an
      # hour and a half or never finished. They cost about a minute here, which
      # is the whole point, so nothing is excluded from CI.
      - name: Reproduce every published number
        run: ctest --test-dir build --output-on-failure -j2

      # The two strands are one pipeline: the rank search emits the encoding
      # operators, and the sparsification is what those are for.
      - name: The pipeline, end to end
        run: |
          ./build/bilinear_rank/minimise-rank fixtures/f2_5x5.tensor --steps 2 \
            --emit-operators /tmp/f2_5x5
          ./build/matrix_sparsification/sparsify-operator /tmp/f2_5x5_left.matrix
          ./build/matrix_sparsification/sparsify-operator /tmp/f2_5x5_right.matrix

      # The exact search on maps whose answers are known independently:
      # Karatsuba, the write-up's own example, and GF(4) and GF(8).
      - name: The exact search reaches the classical answers
        run: |
          ./build/bilinear_rank/decide-rank fixtures/f2_2x2.tensor
          ./build/bilinear_rank/decide-rank fixtures/f2_2x3.tensor
          ./build/bilinear_rank/make-tensor --field 2 1 1 1 > /tmp/gf4.tensor
          ./build/bilinear_rank/decide-rank /tmp/gf4.tensor
          ./build/bilinear_rank/decide-rank fixtures/gf8_multiplication.tensor

      - name: Show the results the README quotes
        run: |
          for fixture in f2_5x5 f2_3x8 f2_4x7 f3_3x6; do
            ./build/bilinear_rank/minimise-rank fixtures/$fixture.tensor
          done
          for operator in strassen_u strassen_v alternative_basis_u; do
            ./build/matrix_sparsification/sparsify-operator fixtures/$operator.matrix
          done
