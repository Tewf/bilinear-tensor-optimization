name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Build and reproduce the table
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Givaro, from the CASYS team at the LJK: exact arithmetic over GF(p) and
      # over the rationals. It is the only dependency.
      - name: Install Givaro
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgivaro-dev ninja-build

      # The repository claims the internship was carried over whole. This is
      # what makes that checkable rather than merely stated.
      - name: Every function of the original is accounted for
        run: python3 tools/check_coverage.py

      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Everything, including the three searches that took the internship an
      # hour and a half or never finished, and the exhaustions behind
      # `12 <= rank(F2 5x5)`. Two minutes here, which is the whole point, so
      # nothing is excluded from CI.
      - name: Reproduce every published number
        run: ctest --test-dir build --output-on-failure -j2

      # The two strands are one pipeline: the rank search emits the encoding
      # operators, and the sparsification is what those are for.
      - name: The pipeline, end to end
        run: |
          ./build/bilinear_rank/minimise-rank fixtures/f2_5x5.tensor --steps 2 \
            --emit-operators /tmp/f2_5x5
          ./build/matrix_sparsification/sparsify-operator /tmp/f2_5x5_L.sms
          ./build/matrix_sparsification/sparsify-operator /tmp/f2_5x5_R.sms

      # The exact search on maps whose answers are known independently:
      # Karatsuba, the write-up's own example, GF(4), GF(8), and Strassen.
      - name: The exact search reaches the classical answers
        run: |
          ./build/bilinear_rank/decide-rank fixtures/f2_2x2.tensor
          ./build/bilinear_rank/decide-rank fixtures/f2_2x3.tensor
          ./build/bilinear_rank/make-tensor --field 2 1 1 1 > /tmp/gf4.tensor
          ./build/bilinear_rank/decide-rank /tmp/gf4.tensor
          ./build/bilinear_rank/decide-rank fixtures/gf8_multiplication.tensor
          ./build/bilinear_rank/decide-rank fixtures/matmul_2x2x2.tensor --target 7

      # A run that does not fit says so and stops, rather than reaching the
      # allocator. The pool for 4x4 matrix multiplication is 4.3e9 rank-one
      # maps, about 720 GB, which is what this guards.
      - name: An impossible run is refused, not attempted
        run: |
          ./build/bilinear_rank/make-tensor --matmul 2 4 4 4 > /tmp/matmul_4x4x4.tensor
          if ./build/bilinear_rank/decide-rank /tmp/matmul_4x4x4.tensor --target 47; then
            echo "the 4x4x4 pool was not refused"; exit 1
          fi

      # Hastad's theorem in both directions, and neither needs a solver
      # installed: the reduction's witness is checked against the tensor it
      # decomposes, and the encoding is checked by writing the question out.
      - name: Tensor rank and satisfiability are the same problem
        run: |
          ./build/satisfiability/decide-rank-by-sat fixtures/matmul_2x2x2.tensor \
            --target 7 --emit-cnf /tmp/strassen_k7.cnf
          head -1 /tmp/strassen_k7.cnf
          ./build/satisfiability/decide-rank-by-sat fixtures/f3_3x6.tensor \
            --target 10 --backend smt --emit-cnf /tmp/f3_k10.smt2
          head -3 /tmp/f3_k10.smt2

      # The finder, from a tensor and nothing else, with the refusal checked if
      # a proof checker is present. Needs a solver, so it is tolerant of one
      # being absent rather than failing the build.
      - name: A rank from a tensor alone
        run: |
          if command -v kissat >/dev/null || command -v cryptominisat >/dev/null; then
            ./build/satisfiability/decide-rank-by-sat fixtures/matmul_2x2x2.tensor \
              --break-symmetry --plain-cnf --proof /tmp/strassen.drat
          else
            echo "no SAT solver on PATH, skipping"
          fi

      - name: Show the results the README quotes
        run: |
          for fixture in f2_5x5 f2_3x8 f2_4x7 f3_3x6; do
            ./build/bilinear_rank/minimise-rank fixtures/$fixture.tensor
          done
          for operator in strassen_u strassen_v alternative_basis_u; do
            ./build/matrix_sparsification/sparsify-operator fixtures/$operator.matrix
          done
